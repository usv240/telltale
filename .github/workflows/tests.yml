name: tests
on:
  push:
  pull_request:
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        working-directory: pipeline
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless==5.0.0.93 numpy==2.5.2 pytest==9.1.1
      - name: Report OpenCV build
        run: python -c "import cv2, platform; print(platform.machine(), cv2.__version__, cv2.__file__)"
      - name: Unit and end-to-end tests
        working-directory: pipeline
        run: python -m pytest -q
      - name: E1 accuracy gate
        working-directory: pipeline
        run: python -m telltale e1 --trials 2 --out ../out/e1-${{ matrix.arch }}
      - name: Verify every headline claim against the result files
        run: python evaluation/verify_claims.py --skip-live
      - name: Offline worker path (local store)
        run: python infra/scripts/seed_demo.py --local out/demo-${{ matrix.arch }} --epochs 12 --size 192
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.arch }}
          path: out/
