AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TellTale: camera-based slope creep measurement and failure-time forecasting.
  One bucket (ingest, private state, public dashboard), one SQS epoch queue with DLQ,
  one Graviton worker running the OpenCV 5 pipeline, CloudFront in front of the dashboard.

Parameters:
  WorkerAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: >
      arm64 AMI for the worker. Default is stock Ubuntu 24.04 (the E6 baseline). For the
      COOL path, subscribe to "Cloud Optimized OpenCV for AWS Graviton" on AWS Marketplace
      and pass the COOL AMI id through CoolAmiId instead.
  CoolAmiId:
    Type: String
    Default: ""
    Description: Optional COOL Marketplace AMI id (arm64). When set, overrides WorkerAmiId.
  InstanceType:
    Type: String
    Default: c8g.large
    AllowedValues: [c8g.large, c8g.xlarge, c8g.2xlarge, c7g.large, c7g.xlarge, m8g.large, t4g.medium]
  BucketName:
    Type: String
    Default: ""
    Description: Leave blank to use telltale-<account-id>.
  AlertEmail:
    Type: String
    Default: ""
    Description: Duty contact e-mail for CRITICAL alerts and system-health alarms (optional).
  AgentMode:
    Type: String
    Default: llm
    AllowedValues: [llm, rules, off]
    Description: Supervising agent policy on the worker. llm = Claude on Amazon Bedrock; rules = deterministic; off = thresholds only.
  IdleStopMinutes:
    Type: Number
    Default: 20
    MinValue: 0
    Description: Scale to zero. The worker stops its instance after this many minutes with an empty queue, and a scheduled function starts it when epochs are waiting. 0 keeps it running.
  ApprovalSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Shared secret that signs approve / dismiss links (deploy.sh generates one).

Conditions:
  UseCool: !Not [!Equals [!Ref CoolAmiId, ""]]
  DefaultBucketName: !Equals [!Ref BucketName, ""]
  HasEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  AlwaysOn: !Equals [!Ref IdleStopMinutes, 0]
  ScaleToZero: !Not [!Condition AlwaysOn]

Resources:
  # ---------------------------------------------------------------- alerting and human approval
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-alerts
      DisplayName: TellTale alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  ApprovalSecretParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/approval-secret
      Type: String
      Value: !Ref ApprovalSecret
      Description: Signs approve / dismiss links; read by the worker and the approval function

  ApprovalRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: telltale-approval
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:aws:s3:::telltale-${AWS::AccountId}/public/sites/*/decisions.json
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref AlertTopic

  ApprovalFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-approval
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 10
      Role: !GetAtt ApprovalRole.Arn
      Environment:
        Variables:
          BUCKET: !Sub telltale-${AWS::AccountId}
          SECRET: !Ref ApprovalSecret
          TOPIC: !Ref AlertTopic
      Code:
        ZipFile: |
          import json, os, hmac, hashlib, time, boto3
          s3 = boto3.client("s3"); sns = boto3.client("sns")
          B, S, T = os.environ["BUCKET"], os.environ["SECRET"], os.environ["TOPIC"]
          def sign(site, t, action):
              return hmac.new(S.encode(), f"{site}|{t}|{action}".encode(), hashlib.sha256).hexdigest()[:32]
          def page(title, body, code=200):
              return {"statusCode": code, "headers": {"content-type": "text/html; charset=utf-8"},
                      "body": f"<!doctype html><meta name=viewport content='width=device-width'><body style='font-family:system-ui;max-width:40em;margin:3em auto'><h2>{title}</h2><p>{body}</p></body>"}
          def handler(event, ctx):
              q = event.get("queryStringParameters") or {}
              site, t, action, tok = q.get("site", ""), q.get("t", ""), q.get("action", ""), q.get("token", "")
              if action not in ("approve", "dismiss") or not site or not t:
                  return page("TellTale", "Missing parameters.", 400)
              if not hmac.compare_digest(tok, sign(site, t, action)):
                  return page("TellTale", "This link is not valid.", 403)
              key = f"public/sites/{site}/decisions.json"
              try:
                  dec = json.loads(s3.get_object(Bucket=B, Key=key)["Body"].read())
              except Exception:
                  dec = {"decisions": []}
              ip = (event.get("requestContext", {}).get("http", {}) or {}).get("sourceIp", "")
              rec = {"site": site, "t": float(t), "action": action, "at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "source": ip}
              dec["decisions"] = [d for d in dec["decisions"] if not (d["t"] == rec["t"] and d["site"] == site)] + [rec]
              s3.put_object(Bucket=B, Key=key, Body=json.dumps(dec, indent=1), ContentType="application/json")
              sns.publish(TopicArn=T, Subject=f"TellTale {site}: alert {action}d", Message=json.dumps(rec, indent=1))
              verb = "approved. The public alert for this site may now be issued." if action == "approve" else "dismissed. No public alert will be issued for this episode; the instrument keeps measuring."
              return page("TellTale decision recorded", f"Site <b>{site}</b>, epoch t = {t}: {verb} Logged at {rec['at']}.")

  ApprovalUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApprovalFunction
      AuthType: NONE

  ApprovalUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # ---------------------------------------------------------------- queueing
  EpochDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-epochs-dlq
      MessageRetentionPeriod: 1209600

  EpochQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-epochs
      VisibilityTimeout: 600
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EpochDLQ.Arn
        maxReceiveCount: 3

  EpochQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EpochQueue]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EpochQueue.Arn
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }

  # ---------------------------------------------------------------- storage
  DataBucket:
    Type: AWS::S3::Bucket
    DependsOn: EpochQueuePolicy
    Properties:
      BucketName: !If [DefaultBucketName, !Sub "telltale-${AWS::AccountId}", !Ref BucketName]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }   # series/forecast history is auditable and recoverable
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-bursts
            Status: Enabled
            Prefix: ingest/
            ExpirationInDays: 30
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt EpochQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - { Name: prefix, Value: ingest/ }
                  - { Name: suffix, Value: manifest.json }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadPublicPrefix
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${DataBucket.Arn}/public/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---------------------------------------------------------------- dashboard
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: TellTale dashboard
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: s3public
            DomainName: !GetAtt DataBucket.RegionalDomainName
            OriginPath: /public
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: s3public
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # CachingDisabled: series and forecast JSON must reflect the latest epoch immediately.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad

  # ---------------------------------------------------------------- worker
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: telltale-worker
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::telltale-${AWS::AccountId}/*
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:aws:s3:::telltale-${AWS::AccountId}
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt EpochQueue.Arn
              - Effect: Allow
                Action: [cloudwatch:PutMetricData]
                Resource: "*"
                Condition:
                  StringEquals: { cloudwatch:namespace: TellTale }
              - Effect: Allow
                Action: [sns:Publish]
                Resource: !Ref AlertTopic
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/approval-secret
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.*
                  - arn:aws:bedrock:*::foundation-model/anthropic.*
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/telltale/*

  WorkerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref WorkerRole]

  WorkerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: TellTale worker, no inbound (access via SSM Session Manager); default egress

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /telltale/worker
      RetentionInDays: 30

  Worker:
    Type: AWS::EC2::Instance
    DependsOn: DataBucket
    Properties:
      ImageId: !If [UseCool, !Ref CoolAmiId, !Ref WorkerAmiId]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WorkerInstanceProfile
      SecurityGroupIds: [!Ref WorkerSecurityGroup]
      # The worker's idle shutdown stops (never terminates) the instance; WakeFunction restarts it.
      InstanceInitiatedShutdownBehavior: stop
      # IMDSv2 only: instance credentials cannot be read through a forwarded request (SSRF).
      MetadataOptions: { HttpTokens: required, HttpPutResponseHopLimit: 1 }
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          # COOL AMIs ship 50 to 80 GB root snapshots and a smaller volume fails the launch, so
          # on COOL the volume takes the snapshot's own size.
          Ebs: { VolumeSize: !If [UseCool, !Ref "AWS::NoValue", 20], VolumeType: gp3, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-worker" }
        - { Key: Project, Value: telltale }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          export TELLTALE_BUCKET=telltale-${AWS::AccountId}
          export TELLTALE_QUEUE_URL=${EpochQueue}
          export TELLTALE_REGION=${AWS::Region}
          export TELLTALE_STACK=${AWS::StackName}
          export TELLTALE_ALERT_TOPIC=${AlertTopic}
          export TELLTALE_APPROVAL_URL=${ApprovalUrl.FunctionUrl}
          export TELLTALE_SECRET_PARAM=/${AWS::StackName}/approval-secret
          export TELLTALE_AGENT=${AgentMode}
          export TELLTALE_IDLE_STOP_MIN=${IdleStopMinutes}
          export TELLTALE_DASHBOARD_URL=https://${Distribution.DomainName}
          mkdir -p /opt/telltale && cd /opt/telltale
          apt-get update -y
          apt-get install -y python3-venv python3-pip unzip curl
          if ! command -v aws >/dev/null; then apt-get install -y awscli || snap install aws-cli --classic; fi
          # The release tarball is uploaded by deploy.sh right after the stack is created;
          # wait for it instead of failing the first boot.
          for i in $(seq 1 60); do
            if aws s3 cp s3://$TELLTALE_BUCKET/release/pipeline.tar.gz /opt/telltale/pipeline.tar.gz; then break; fi
            echo "release not yet available, retry $i"; sleep 15
          done
          tar xzf pipeline.tar.gz
          bash infra/worker/bootstrap.sh

  # ---------------------------------------------------------------- scale to zero
  # The worker stops its own instance after IdleStopMinutes with an empty queue. Every five
  # minutes this function starts it again if epochs are waiting. A stopped worker costs only
  # its disk; the dashboard is static on CloudFront and stays live throughout. If the start
  # fails, epochs age in the queue and QueueAgeAlarm pages the duty contact.
  WakeRole:
    Type: AWS::IAM::Role
    Condition: ScaleToZero
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: telltale-wake
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [sqs:GetQueueAttributes]
                Resource: !GetAtt EpochQueue.Arn
              - Effect: Allow
                Action: [ec2:StartInstances]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Worker}
              - Effect: Allow
                Action: [ec2:DescribeInstances]
                Resource: "*"

  WakeFunction:
    Type: AWS::Lambda::Function
    Condition: ScaleToZero
    Properties:
      FunctionName: !Sub ${AWS::StackName}-wake
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 15
      Role: !GetAtt WakeRole.Arn
      Environment:
        Variables:
          QUEUE: !Ref EpochQueue
          INSTANCE: !Ref Worker
      Code:
        ZipFile: |
          import os, boto3
          sqs = boto3.client("sqs"); ec2 = boto3.client("ec2")
          def handler(event, ctx):
              a = sqs.get_queue_attributes(QueueUrl=os.environ["QUEUE"], AttributeNames=["ApproximateNumberOfMessages"])["Attributes"]
              waiting = int(a["ApproximateNumberOfMessages"])
              inst = os.environ["INSTANCE"]
              state = ec2.describe_instances(InstanceIds=[inst])["Reservations"][0]["Instances"][0]["State"]["Name"]
              if waiting and state == "stopped":
                  ec2.start_instances(InstanceIds=[inst])
                  print(f"started {inst}: {waiting} epochs waiting")
              return {"waiting": waiting, "state": state}

  WakeSchedule:
    Type: AWS::Events::Rule
    Condition: ScaleToZero
    Properties:
      Description: Start the TellTale worker when epochs are waiting
      ScheduleExpression: rate(5 minutes)
      Targets: [{ Id: wake, Arn: !GetAtt WakeFunction.Arn }]

  WakePermission:
    Type: AWS::Lambda::Permission
    Condition: ScaleToZero
    Properties:
      FunctionName: !Ref WakeFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WakeSchedule.Arn

  # ---------------------------------------------------------------- run it live
  # A judge (or anyone) presses one button on the dashboard: a pre-rendered slope collapse is
  # copied into ingest/ for the site live-demo, the worker is started, and the real pipeline,
  # COOL and the Claude agent process it while the page watches. One run per 20 minutes and
  # twelve per day, so the endpoint's cost is bounded (about 1 USD a run, mostly Bedrock).
  LiveRunRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: telltale-live-run
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub arn:aws:s3:::telltale-${AWS::AccountId}
                Condition: { StringLike: { "s3:prefix": ["samples/live-demo/*"] } }
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub arn:aws:s3:::telltale-${AWS::AccountId}/samples/live-demo/*
                  - !Sub arn:aws:s3:::telltale-${AWS::AccountId}/private/live/*
                  - !Sub arn:aws:s3:::telltale-${AWS::AccountId}/public/sites/live-demo/*
              - Effect: Allow
                Action: [s3:PutObject]
                Resource:
                  - !Sub arn:aws:s3:::telltale-${AWS::AccountId}/ingest/live-demo/*
                  - !Sub arn:aws:s3:::telltale-${AWS::AccountId}/private/live/*
                  - !Sub arn:aws:s3:::telltale-${AWS::AccountId}/public/sites/live-demo/*
              - Effect: Allow
                Action: [s3:DeleteObject]
                Resource: !Sub arn:aws:s3:::telltale-${AWS::AccountId}/private/sites/live-demo/*
              - Effect: Allow
                Action: [ec2:StartInstances]
                Resource: !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${Worker}
              - Effect: Allow
                Action: [ec2:DescribeInstances]
                Resource: "*"

  LiveRunFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-live-run
      Runtime: python3.12
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      Role: !GetAtt LiveRunRole.Arn
      Environment:
        Variables:
          BUCKET: !Sub telltale-${AWS::AccountId}
          INSTANCE: !Ref Worker
      Code:
        ZipFile: |
          import json, os, time, random, boto3
          from botocore.exceptions import ClientError, ParamValidationError
          s3 = boto3.client("s3"); ec2 = boto3.client("ec2")
          B, INST, SITE = os.environ["BUCKET"], os.environ["INSTANCE"], "live-demo"
          RUNS, GAP, DAILY = "private/live/runs.json", 20 * 60, 12
          PUB, PRIV, SAMPLES = f"public/sites/{SITE}", f"private/sites/{SITE}", f"samples/{SITE}/"
          def out(code, body):
              return {"statusCode": code, "headers": {"content-type": "application/json", "cache-control": "no-store"},
                      "body": json.dumps(body)}
          def put(key, obj, **kw):
              s3.put_object(Bucket=B, Key=key, Body=json.dumps(obj).encode(), ContentType="application/json",
                            CacheControl="no-store", **kw)
          def read_runs():
              # A missing log means no runs yet; any other read error is raised, never read as "no runs".
              try:
                  o = s3.get_object(Bucket=B, Key=RUNS)
                  return json.loads(o["Body"].read()), o["ETag"]
              except ClientError as e:
                  if e.response["Error"]["Code"] in ("NoSuchKey", "404"):
                      return [], None
                  raise
          def claim(runs, etag):
              # Write the run before doing any work, conditionally, so two presses cannot both start.
              kw = {"IfMatch": etag} if etag else {"IfNoneMatch": "*"}
              try:
                  put(RUNS, runs, **kw)
              except ParamValidationError:
                  put(RUNS, runs)          # an SDK without conditional writes: best effort
              except ClientError as e:
                  if e.response["Error"]["Code"] in ("PreconditionFailed", "ConditionalRequestConflict", "412", "409"):
                      return False
                  raise
              return True
          def start_worker():
              for _ in range(10):          # a worker that is shutting down cannot be started yet
                  st = ec2.describe_instances(InstanceIds=[INST])["Reservations"][0]["Instances"][0]["State"]["Name"]
                  if st != "stopping":
                      break
                  time.sleep(3)
              try:
                  ec2.start_instances(InstanceIds=[INST])
              except Exception as e:
                  print("start:", e)       # the wake function retries every five minutes
          def handler(event, ctx):
              method = (event.get("requestContext", {}).get("http", {}) or {}).get("method", "GET")
              runs, etag = read_runs()
              now = time.time()
              last = max((r["at"] for r in runs), default=0)
              today = [r for r in runs if now - r["at"] < 86400]
              status = {"last_run": last or None, "runs_today": len(today), "daily_limit": DAILY,
                        "next_allowed": max(now, last + GAP, (min(r["at"] for r in today) + 86400) if len(today) >= DAILY else 0),
                        "epochs": runs[-1]["epochs"] if runs else None, "now": now}
              if method == "OPTIONS":
                  return out(204, {})
              if method != "POST":
                  return out(200, status)
              if now < status["next_allowed"]:
                  return out(429, dict(status, error="A run is already under way or the limit is reached. Watch the current one."))
              pages = s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix=SAMPLES, Delimiter="/")
              variants = [p["Prefix"] for page in pages for p in page.get("CommonPrefixes", [])]
              if not variants:
                  return out(503, dict(status, error="No staged samples. Run infra/scripts/stage_live_demo.py."))
              variant = random.choice(variants)
              keys = [o["Key"] for page in s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix=variant)
                      for o in page.get("Contents", [])]
              epochs = sorted({k.split("/")[3] for k in keys if k.count("/") >= 4})
              runs = (today + [{"at": now, "variant": variant, "epochs": len(epochs)}])[-50:]
              if not claim(runs, etag):
                  return out(409, dict(status, error="Someone started a run a moment ago. Watch that one."))
              # Reset the site so the run starts from its own reference, decisions and pages.
              for k in ("reference.npy", "previous.npy"):
                  s3.delete_object(Bucket=B, Key=f"{PRIV}/{k}")
              put(f"{PUB}/series.json", {"records": []})
              put(f"{PUB}/agentlog.json", {"events": []})
              put(f"{PUB}/decisions.json", {"decisions": []})
              put(f"{PUB}/pages.json", {"pages": []})
              put(f"{PUB}/run.json", {"started": now, "variant": variant.rstrip("/").split("/")[-1], "epochs": len(epochs)})
              start_worker()
              for e in epochs:
                  mk = f"{variant}{e}/manifest.json"
                  man = json.loads(s3.get_object(Bucket=B, Key=mk)["Body"].read())
                  dest = f"ingest/{SITE}/{man['t']:g}/"
                  for f in man["frames"]:
                      s3.copy_object(Bucket=B, Key=dest + f, CopySource={"Bucket": B, "Key": f"{variant}{e}/{f}"})
                  s3.copy_object(Bucket=B, Key=dest + "manifest.json", CopySource={"Bucket": B, "Key": mk})
              return out(202, dict(status, last_run=now, runs_today=len(runs), epochs=len(epochs), next_allowed=now + GAP,
                                   started=True))

  LiveRunUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref LiveRunFunction
      AuthType: NONE
      Cors:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}"]
        AllowMethods: [GET, POST]
        MaxAge: 300

  LiveRunUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LiveRunFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  LiveRunInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LiveRunFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---------------------------------------------------------------- liveness alarms
  QueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Epochs waiting more than 15 minutes; worker is down or overloaded
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt EpochQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An epoch failed three times and landed in the dead-letter queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt EpochDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  WorkerStoppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: AlwaysOn   # with scale to zero a stopped worker is normal; QueueAgeAlarm covers it
    Properties:
      AlarmDescription: Worker instance stopped reporting CPU for 15 minutes (stopped or crashed)
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{ Name: InstanceId, Value: !Ref Worker }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-ops
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 8, "height": 6, "properties": {"title": "Epochs processed / usable", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
            "metrics": [["TellTale", "EpochProcessed", "Site", "demo-slope"], [".", "EpochUsable", ".", "."]]}},
          {"type": "metric", "x": 8, "y": 0, "width": 8, "height": 6, "properties": {"title": "Alarm level (0 quiet .. 3 critical)", "region": "${AWS::Region}", "stat": "Maximum", "period": 300,
            "metrics": [["TellTale", "AlarmLevel", "Site", "demo-slope"]]}},
          {"type": "metric", "x": 16, "y": 0, "width": 8, "height": 6, "properties": {"title": "Seconds per epoch", "region": "${AWS::Region}", "stat": "Average", "period": 300,
            "metrics": [["TellTale", "EpochSeconds", "Site", "demo-slope"]]}},
          {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {"title": "Coverage and stabilization inliers", "region": "${AWS::Region}", "stat": "Average", "period": 300,
            "metrics": [["TellTale", "Coverage", "Site", "demo-slope"], [".", "StabilizeInliers", ".", ".", {"yAxis": "right"}]]}},
          {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {"title": "Queue depth and age", "region": "${AWS::Region}", "stat": "Maximum", "period": 60,
            "metrics": [["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${EpochQueue.QueueName}"], [".", "ApproximateAgeOfOldestMessage", ".", ".", {"yAxis": "right"}]]}},
          {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {"title": "Worker CPU", "region": "${AWS::Region}", "stat": "Average", "period": 60,
            "metrics": [["AWS/EC2", "CPUUtilization", "InstanceId", "${Worker}"]]}},
          {"type": "log", "x": 0, "y": 12, "width": 24, "height": 6, "properties": {"title": "Worker log", "region": "${AWS::Region}",
            "query": "SOURCE '/telltale/worker' | fields @timestamp, @message | sort @timestamp desc | limit 50"}}
        ]}

Outputs:
  OpsDashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-ops
  AlertTopicArn:
    Value: !Ref AlertTopic
  ApprovalUrl:
    Value: !GetAtt ApprovalUrl.FunctionUrl
  Bucket:
    Value: !Ref DataBucket
  QueueUrl:
    Value: !Ref EpochQueue
  DashboardUrl:
    Value: !Sub https://${Distribution.DomainName}/
  WorkerInstanceId:
    Value: !Ref Worker
  LiveRunUrl:
    Description: POST starts a live run of the demo collapse (rate limited); GET returns its status
    Value: !GetAtt LiveRunUrl.FunctionUrl
  WorkerAmi:
    Value: !If [UseCool, !Ref CoolAmiId, !Ref WorkerAmiId]
